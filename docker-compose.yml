services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - kontor_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/martorii/kontor-api:${KONTOR_TAG:-v1.0.1} # x-release-please-version
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: ghcr.io/martorii/kontor-api:${KONTOR_TAG:-v1.0.1} # x-release-please-version
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RULES_PATH: /app/config/rules.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; Docker Desktop already provides the name
    volumes:
      # The real rules.yaml is gitignored. Copy config/rules.example.yaml to config/rules.yaml.
      - ./config:/app/config:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: ghcr.io/martorii/kontor-ui:${KONTOR_TAG:-v1.0.1} # x-release-please-version
    environment:
      API_URL: http://api:8000
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  kontor_pgdata:
